name: GitHub-only website verification

on:
  push:
    branches: [main]
    paths:
      - '.github/ci-requests/**'

permissions:
  contents: read

concurrency:
  group: github-only-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mode:
    name: Validate explicit milestone/completion CI request
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run_tests: ${{ steps.check.outputs.run_tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Self-test and validate request against canonical mode
        id: check
        run: |
          python3 tools/ci-mode-gate.py --self-test
          python3 tools/ci-mode-gate.py

  website:
    name: Website clean-checkout build and static gates
    needs: mode
    if: needs.mode.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.17.0
      - name: Install locked website dependencies
        run: npm ci --prefix website
      - name: Verify website TypeScript
        run: npm --prefix website run typecheck
      - name: Lint website
        run: npm --prefix website run lint
      - name: Build website for production
        run: npm --prefix website run build
      - name: Record exact verified commit
        run: echo "GITHUB_ONLY_WEBSITE_VERIFIED_SHA=$GITHUB_SHA"
