name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Clean checkout acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      COMPOSER_NO_INTERACTION: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_CHANNEL: chromium
      PLAYWRIGHT_WEBSERVER_TIMEOUT_MS: "120000"
      PLAYWRIGHT_WEBSITE_SERVER_COMMAND: npm --prefix ../website run start
      WEBSITE_API_TIMEOUT_MS: "12000"

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Start isolated MySQL 8.4 service
        shell: bash
        run: |
          docker run --detach --name mobisttech-ci-mysql             --env MYSQL_ROOT_PASSWORD=root-ci-only             --env MYSQL_DATABASE=mobisttech_test             --env MYSQL_USER=mobisttech             --env MYSQL_PASSWORD=mobisttech-ci             --publish 127.0.0.1:13306:13306             mysql:8.4 --port=13306 --mysqlx=0
          for attempt in {1..30}; do
            if docker exec mobisttech-ci-mysql mysqladmin ping -h 127.0.0.1 -P 13306 -proot-ci-only --silent; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs mobisttech-ci-mysql
              exit 1
            fi
            sleep 2
          done
          docker exec mobisttech-ci-mysql mysql -uroot -proot-ci-only -e "SELECT @@port AS port, VERSION() AS version;"

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: "8.3.33"
          extensions: bcmath, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            website/package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.17.0

      - name: Install backend dependencies
        run: composer install --working-dir=backend --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Install frontend dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix website

      - name: Prepare isolated test environment
        working-directory: backend
        run: |
          mkdir -p             storage/app/private             storage/framework/cache/data             storage/framework/sessions             storage/framework/testing             storage/framework/views             storage/logs             bootstrap/cache
          cp .env.ci.example .env.testing
          php artisan key:generate --env=testing --force
          php -r '$pdo=new PDO("mysql:host=127.0.0.1;port=13306;dbname=mobisttech_test","mobisttech","mobisttech-ci"); $row=$pdo->query("SELECT @@port AS port, VERSION() AS version")->fetch(PDO::FETCH_ASSOC); echo "MYSQL_PORT=".$row["port"]." MYSQL_VERSION=".$row["version"].PHP_EOL; if ((int)$row["port"] !== 13306) { exit(3); }'
          php -r 'require "vendor/autoload.php"; $redis=new Predis\Client(["scheme"=>"tcp","host"=>"127.0.0.1","port"=>16379]); echo "REDIS=".$redis->ping().PHP_EOL;'
          php artisan migrate:fresh --env=testing --force

      - name: Composer and PHP style gates
        working-directory: backend
        run: |
          composer validate --no-interaction
          vendor/bin/pint --test

      - name: Backend TypeScript and production build
        run: |
          npm --prefix backend run typecheck
          npm --prefix backend run build

      - name: Full backend regression
        working-directory: backend
        run: php artisan test

      - name: Explicit MySQL race and reset gates
        working-directory: backend
        run: php artisan test tests/Feature/InventoryConcurrencyTest.php tests/Feature/GuardedResetServiceTest.php

      - name: Website TypeScript lint and production build
        run: |
          npm --prefix website run typecheck
          npm --prefix website run lint
          npm --prefix website run build

      - name: Public bundle and secret-marker budgets
        run: node tools/ci/verify-public-budgets.mjs

      - name: Tracked secret scan
        shell: bash
        run: |
          if git grep -n -I -E '(AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,}|gh[pousr]_[A-Za-z0-9_]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk_(live|test)_[A-Za-z0-9]{16,})' -- . ':(exclude).local/**'; then
            echo "Tracked secret-like value detected."
            exit 1
          fi
          echo "TRACKED_SECRET_SCAN=PASS"

      - name: Install Playwright Chromium
        working-directory: backend
        run: npx playwright install --with-deps chromium

      - name: Reset browser test schema
        working-directory: backend
        run: php artisan migrate:fresh --env=testing --force

      - name: POS and Admin Playwright
        working-directory: backend
        run: npx playwright test --config=playwright.config.ts

      - name: Website production Playwright and performance budgets
        working-directory: backend
        run: npx playwright test --config=playwright.website.config.ts

      - name: Final schema and cleanup gate
        working-directory: backend
        run: php ../tools/migration/verify_mysql_schema.php api

      - name: Ensure no tracked runtime artifacts
        shell: bash
        run: |
          test ! -f backend/public/hot
          test ! -f backend/.env.testing || git check-ignore -q backend/.env.testing
          git diff --exit-code
          status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi
          echo "WORKTREE=clean"
