name: One-time guarded PHP style remediation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/php-style-remediation-once.yml'

permissions:
  contents: write

jobs:
  format-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact authorized snapshot
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 2
      - name: Verify exact baseline and original project
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = 'lawangin00/mobisttech'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD^)" = 'da0611ac4835cbf09cb732cb4e35aa462d2ebad6'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = '.github/workflows/php-style-remediation-once.yml'
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import json
          d=json.load(open('docs/PROJECT_IDENTITY.json'))
          assert d['project_id']=='282dba2f-a2d9-47e8-aa8d-e499fbe1706c' and d['project_name']=='Mobisttech'
          print('FORMATTING_IDENTITY=PASS')
          PY
      - name: Setup pinned PHP and composer
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.3.33'
          tools: composer:v2
          coverage: none
      - name: Apply and validate exactly 31 PHP-style-only file changes
        shell: bash
        run: |
          composer install --working-dir=backend --no-interaction --no-progress --prefer-dist --optimize-autoloader
          (cd backend && vendor/bin/pint)
          (cd backend && vendor/bin/pint --test)
          mapfile -t paths < <(git diff --name-only)
          echo "PINT_FORMATTED_FILE_COUNT=${#paths[@]}"
          test "${#paths[@]}" -eq 31
          for path in "${paths[@]}"; do
            [[ "$path" == backend/* && "$path" == *.php ]] || { echo "Unexpected formatted path: $path"; exit 1; }
            php -l "$path" >/dev/null
            echo "PINT_FORMATTED_PATH=$path"
          done
          git diff --check -- backend
          test -z "$(git status --porcelain --untracked-files=all | grep -v '^ M backend/' || true)"
      - name: Push only PHP formatting, never a workflow file
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- backend/app backend/database backend/routes backend/tests
          test "$(git diff --cached --name-only | wc -l)" -eq 31
          git diff --cached --check
          git commit -m 'style: normalize existing PHP files for clean GitHub acceptance'
          git push origin HEAD:main
          echo 'PINT_STYLE_REMEDIATION_PUSH=PASS'
