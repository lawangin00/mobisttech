name: One-time guarded Mobisttech display-name reconciliation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complete-mode-rollout.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact authorized Mobisttech snapshot
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Validate source and prepare display-name-only docs
        run: python3 tools/control/complete-mode-rollout.py
      - name: Commit only approved display-name edits, not workflow files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- AGENTS.md README.md docs
          test "$(git diff --cached --name-only | grep -v -E '^(AGENTS\.md|README\.md|docs/)')" = ''
          git diff --cached --name-only
          git commit -m 'docs: standardize Mobisttech visible project name without changing source inputs'
          git push origin HEAD:main
          echo 'DISPLAY_NAME_ROLLOUT_PUSH=PASS'
