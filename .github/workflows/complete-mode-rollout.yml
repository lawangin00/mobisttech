name: One-time guarded Mobisttech mode rollout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complete-mode-rollout.yml'
      - 'tools/control/complete-mode-rollout.py'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact authorized Mobisttech snapshot
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Validate original sources and prepare scoped changes
        run: python3 tools/control/complete-mode-rollout.py
      - name: Commit and push exact scoped reconciliation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/workflows/ci.yml AGENTS.md README.md docs
          git diff --cached --check -- .github/workflows/ci.yml
          git diff --cached --name-only
          git commit -m 'control: enable mode-gated full CI and correct Mobisttech display names'
          git push origin HEAD:main
          echo 'MODE_ROLLOUT_PUSH=PASS'
